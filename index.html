    <script>
      (function() {
        if (typeof window !== 'undefined') {
          const targets = [window, globalThis, self].filter(t => typeof t !== 'undefined');
          targets.forEach(target => {
            try {
              let currentFetch = target.fetch;
              Object.defineProperty(target, 'fetch', {
                get() {
                  return currentFetch;
                },
                set(val) {
                  currentFetch = val;
                },
                configurable: true,
                enumerable: true
              });
            } catch (e) {
              // Ignore failures
            }
          });

          let customFetch = undefined;
          window.global = new Proxy(window, {
            get(target, prop) {
              if (prop === 'fetch') {
                return customFetch || target.fetch;
              }
              const val = target[prop];
              if (typeof val === 'function') {
                return val.bind(target);
              }
              return val;
            },
            set(target, prop, value) {
              if (prop === 'fetch') {
                customFetch = value;
                return true;
              }
              try {
                target[prop] = value;
              } catch (e) {
                // Ignore silent assignment errors for read-only window properties
              }
              return true;
            }
          });
        }
      })();
    </script>
